<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر ومفكك الخطوط العربية الاحترافي للمنسوجات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f4f8;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 { text-align: center; color: #1a2a3a; margin-bottom: 25px; font-size: 24px; }
        .control-panel {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            align-items: center;
        }
        .input-group { flex-grow: 1; min-width: 250px; }
        textarea {
            width: 100%;
            height: 50px;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            text-align: right;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            font-weight: bold;
            font-size: 14px;
            white-space: nowrap;
        }
        .color-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #ffffff;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }
        .color-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 11px;
            font-weight: bold;
        }
        input[type="color"] {
            border: none;
            width: 32px;
            height: 32px;
            cursor: pointer;
            background: none;
        }
        button, .file-label {
            padding: 12px 18px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            display: inline-block;
            text-align: center;
            white-space: nowrap;
        }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-success { background-color: #10b981; color: white; }
        .btn-success:hover { background-color: #059669; }
        .btn-warning { background-color: #f59e0b; color: white; }
        .btn-warning:hover { background-color: #d97706; }
        .file-label { background-color: #64748b; color: white; }
        input[type="file"] { display: none; }
        .status-badge {
            font-size: 13px;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            background: #cbd5e1;
            white-space: nowrap;
        }
        .status-loaded { background: #bbf7d0; color: #166534; }
        
        .tashkeel-bank {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            padding: 12px;
            background: #e2e8f0;
            border-radius: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tashkeel-item {
            font-size: 18px;
            background: white;
            border: 1px solid #94a3b8;
            border-radius: 6px;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            font-weight: bold;
        }
        .tashkeel-item:hover { background: #cbd5e1; }
        .bank-title {
            width: 100%;
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 5px;
        }

        .canvas-frame {
            border: 2px dashed #94a3b8;
            border-radius: 12px;
            overflow: hidden;
            background: transparent;
            background-image: linear-gradient(45deg, #f1f5f9 25%, transparent 25%), 
                              linear-gradient(-45deg, #f1f5f9 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #f1f5f9 75%), 
                              linear-gradient(-45deg, transparent 75%, #f1f5f9 75%);
            background-size: 20px 20px;
            margin-top: 10px;
            position: relative;
        }
        canvas { display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>محرر ومفكك الخطوط العربية الاحترافي للمنسوجات والبطانيات</h1>
    
    <div class="control-panel">
        <label class="file-label">
            رفع ملف الخط (.ttf)
            <input type="file" id="fontUploader" accept=".ttf,.otf" onchange="loadLocalFontFile(this)">
        </label>
        <span id="fontStatus" class="status-badge">خط النظام الافتراضي</span>

        <!-- Upgraded Multi-line Input Box Area -->
        <div class="input-group">
            <textarea id="textInput" placeholder="اكتب النص هنا (يدعم الأسطر المتعددة لفقرات كاملة)...">فاطمة</textarea>
        </div>

        <div class="slider-group">
            <label for="thicknessSlider">السمك:</label>
            <input type="range" id="thicknessSlider" min="0" max="20" value="0" step="0.5" oninput="updateSelectedThickness(this.value)">
        </div>

        <div class="slider-group">
            <label for="sizeSlider">الحجم:</label>
            <input type="range" id="sizeSlider" min="20" max="300" value="110" step="2" oninput="updateSelectedSize(this.value)">
        </div>

        <!-- NEW: Dynamic Viewport Workspace Expansion Zoom Slider Control -->
        <div class="slider-group" style="background-color: #fffbeb; border-color: #fef08a;">
            <label for="zoomSlider" style="color: #b45309;">زوم اللوحة:</label>
            <input type="range" id="zoomSlider" min="0.2" max="3" value="1" step="0.05" oninput="updateWorkspaceZoom(this.value)">
        </div>

        <div class="color-controls">
            <div class="color-group">
                <label>اللون الأساسي</label>
                <input type="color" id="textColor" value="#1e293b">
            </div>
            <div class="color-group">
                <label>لون التشكيل</label>
                <input type="color" id="tashkeelColor" value="#ef4444">
            </div>
        </div>

        <button class="btn-primary" onclick="generateDecomposedText()">إضافة النص</button>
        <button class="btn-warning" onclick="clearCanvas()">مسح الشاشة</button>
        <button class="btn-success" onclick="exportTransparentPNG()">تحميل PNG شفاف</button>
    </div>

    <div class="tashkeel-bank">
        <div class="bank-title">علامات التشكيل الأساسية:</div>
        <div class="tashkeel-item" onclick="addSingleElement('َ', true)">فتحة َ</div>
        <div class="tashkeel-item" onclick="addSingleElement('ُ', true)">ضمة ُ</div>
        <div class="tashkeel-item" onclick="addSingleElement('ِ', true)">كسرة ِ</div>
        <div class="tashkeel-item" onclick="addSingleElement('ْ', true)">سكون ْ</div>
        <div class="tashkeel-item" onclick="addSingleElement('ّ', true)">شدة ّ</div>
        <div class="tashkeel-item" onclick="addSingleElement('ً', true)">تنوين فتح ً</div>
        <div class="tashkeel-item" onclick="addSingleElement('ٌ', true)">تنوين ضم ٌ</div>
        <div class="tashkeel-item" onclick="addSingleElement('ٍ', true)">تنوين كسر ٍ</div>
    </div>

    <div class="tashkeel-bank" style="background-color: #e0f2fe;">
        <div class="bank-title" style="color: #0369a1;">زخارف وخامات المنسوجات المخصصة (PNG):</div>
        <div class="tashkeel-item" onclick="addCustomImageElement('decor1.png')">زخرفة 1</div>
        <div class="tashkeel-item" onclick="addCustomImageElement('decor2.png')">زخرفة 2</div>
        <div class="tashkeel-item" onclick="addCustomImageElement('decor3.png')">زخرفة 3</div>
        <div class="tashkeel-item" onclick="addCustomImageElement('decor4.png')">زخرفة 4</div>
        <div class="tashkeel-item" onclick="addCustomImageElement('decor5.png')">زخرفة 5</div>
        <div class="tashkeel-item" onclick="addCustomImageElement('decor6.png')">زخرفة 6</div>
        <div class="tashkeel-item" onclick="addCustomImageElement('decor7.png')">زخرفة 7</div>
        <div class="tashkeel-item" onclick="addCustomImageElement('decor8.png')">زخرفة 8</div>
    </div>

    <div class="canvas-frame">
        <canvas id="thuluthCanvas" width="1040" height="450"></canvas>
    </div>
</div>

<script>
    const canvas = document.getElementById('thuluthCanvas');
    const ctx = canvas.getContext('2d');
    
    let elements = [];
    let selectedElements = [];
    let isDragging = false;
    let dragBoxStart = null;
    let currentDragBox = null;
    let startX, startY;
    let activeFontFamilyName = 'Arial, Traditional Arabic';
    let isFontFullyReady = true;
    let zoomLevel = 1.0; // Global scale configuration pointer

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        
        // Apply universal zoom matrix transformations smoothly
        ctx.scale(zoomLevel, zoomLevel);

                for (let i = 0; i < elements.length; i++) {
            const el = elements[i];
            
            ctx.shadowColor = "rgba(0, 0, 0, 0.25)";
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 4;

            if (selectedElements.includes(el)) {
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 2 / zoomLevel; // Normalize vector outlines to zoom context
                ctx.strokeRect(el.x - el.width/2 - 6, el.y - el.height/2 - 6, el.width + 12, el.height + 12);
            }

            if (el.isImage) {
                // FIXED: Corrected getElementByld to getElementById
                const tintColor = el.color || document.getElementById('tashkeelColor').value;
                
                const bufferCanvas = document.createElement('canvas');
                const bCtx = bufferCanvas.getContext('2d');
                bufferCanvas.width = el.width + (el.thickness * 2) + 20;
                bufferCanvas.height = el.height + (el.thickness * 2) + 20;
                
                const centerX = bufferCanvas.width / 2;
                const centerY = bufferCanvas.height / 2;
                
                const steps = Math.ceil(el.thickness);
                if (steps > 0) {
                    bCtx.fillStyle = tintColor;
                    for (let angle = 0; angle < 360; angle += 15) {
                        const rad = angle * Math.PI / 180;
                        const ex = centerX - el.width/2 + Math.cos(rad) * el.thickness;
                        const ey = centerY - el.height/2 + Math.sin(rad) * el.thickness;
                        bCtx.drawImage(el.img, ex, ey, el.width, el.height);
                    }
                    bCtx.globalCompositeOperation = 'source-in';
                    bCtx.fillRect(0, 0, bufferCanvas.width, bufferCanvas.height);
                    bCtx.globalCompositeOperation = 'source-over';
                }
                
                bCtx.drawImage(el.img, centerX - el.width/2, centerY - el.height/2, el.width, el.height);
                bCtx.globalCompositeOperation = 'source-atop';
                bCtx.fillStyle = tintColor;
                bCtx.fillRect(0, 0, bufferCanvas.width, bufferCanvas.height);
                bCtx.globalCompositeOperation = 'source-over';
                
                ctx.drawImage(bufferCanvas, el.x - centerX, el.y - centerY);
                
            } else {
                ctx.font = `${el.size}px ${activeFontFamilyName}`;
                ctx.fillStyle = el.color;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                if (el.thickness > 0) {
                    ctx.strokeStyle = el.color;
                    ctx.lineWidth = el.thickness * 1.5;
                    ctx.lineJoin = "round";
                    
                    if (el.lines) {
                        let lineY = el.y - ((el.lines.length - 1) * el.size * 0.6);
                        el.lines.forEach(line => {
                            ctx.strokeText(line, el.x, lineY);
                            lineY += el.size * 1.2;
                        });
                    } else {
                        ctx.strokeText(el.text, el.x, el.y);
                    }
                }
                
                if (el.lines) {
                    let lineY = el.y - ((el.lines.length - 1) * el.size * 0.6);
                    el.lines.forEach(line => {
                        ctx.fillText(line, el.x, lineY);
                        lineY += el.size * 1.2;
                    });
                } else {
                    ctx.fillText(el.text, el.x, el.y);
                }
            }

            ctx.shadowColor = "transparent";
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        ctx.restore();

        if (dragBoxStart && currentDragBox) {
            ctx.strokeStyle = 'rgba(59, 130, 246, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.fillStyle = 'rgba(59, 130, 246, 0.1)';
            const w = currentDragBox.x - dragBoxStart.x;
            const h = currentDragBox.y - dragBoxStart.y;
            ctx.fillRect(dragBoxStart.x, dragBoxStart.y, w, h);
            ctx.strokeRect(dragBoxStart.x, dragBoxStart.y, w, h);
        }
    }

    function updateWorkspaceZoom(val) {
        zoomLevel = parseFloat(val);
        draw();
    }

    function loadLocalFontFile(inputElement) {
        if (inputElement.files && inputElement.files[0]) {
            isFontFullyReady = false;
            const file = inputElement.files[0]; 
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const uniqueFontID = 'CalligraphyFont_' + Date.now();
                const fontFace = new FontFace(uniqueFontID, event.target.result);
                
                fontFace.load().then(function(loadedFace) {
                    document.fonts.add(loadedFace);
                    activeFontFamilyName = uniqueFontID;
                    
                    document.fonts.ready.then(() => {
                        isFontFullyReady = true;
                        document.getElementById('fontStatus').textContent = "مفعّل: " + file.name;
                        document.getElementById('fontStatus').classList.add('status-loaded');
                        
                        elements.forEach(el => {
                            if (!el.isImage) calculateElementBounds(el);
                        });
                        draw();
                    });
                }).catch(err => {
                    isFontFullyReady = true;
                    alert("Error loading font layout: " + err);
                });
            };
            reader.readAsArrayBuffer(file);
        }
    }

    function calculateElementBounds(el) {
        if (el.isImage) return;
        if (!isFontFullyReady) {
            el.width = el.text.length * (el.size * 0.4);
            el.height = el.size * 0.8;
            return;
        }
        try {
            ctx.font = `${el.size}px ${activeFontFamilyName}`;
            if (el.lines) {
                let maxWidth = 0;
                el.lines.forEach(line => {
                    const metrics = ctx.measureText(line);
                    if (metrics.width > maxWidth) maxWidth = metrics.width;
                });
                el.width = Math.max(maxWidth, el.size * 0.6);
                el.height = el.size * 1.2 * el.lines.length;
            } else {
                const metrics = ctx.measureText(el.text);
                el.width = Math.max(metrics.width, el.size * 0.6);
                el.height = (el.text === 'ُ') ? (el.size * 1.0) : (el.size * 0.7);
            }
        } catch(e) {
            el.width = el.size * 0.7;
            el.height = el.size * 0.7;
        }
    }

    function generateDecomposedText() {
        const rawStringValue = document.getElementById('textInput').value;
        if (!rawStringValue.trim()) return;

        const hexTextColorCode = document.getElementById('textColor').value;
        const separateLines = rawStringValue.split('\n');
        
        let newEl = {
            text: rawStringValue,
            lines: separateLines,
            x: (canvas.width / 2) / zoomLevel,
            y: (canvas.height / 2) / zoomLevel,
            color: hexTextColorCode,
            isTashkeel: false,
            isImage: false,
            size: 110,
            thickness: 0
        };
        calculateElementBounds(newEl);
        elements.push(newEl);
        draw();
    }

    function addSingleElement(characterSymbol, isTashkeelFlag) {
        const hexTashkeelColorCode = document.getElementById('tashkeelColor').value;
        const isUnderSlung = (characterSymbol === 'ِ' || characterSymbol === 'ٍ');
        const defaultY = isUnderSlung ? (canvas.height / 2 + 60) : (isTashkeelFlag ? canvas.height / 2 - 70 : canvas.height / 2);

        let newEl = {
            text: characterSymbol,
            x: (canvas.width / 2) / zoomLevel,
            y: defaultY / zoomLevel,
            color: hexTashkeelColorCode,
            isTashkeel: isTashkeelFlag,
            isImage: false,
            size: 110,
            thickness: 0
        };
        calculateElementBounds(newEl);
        elements.push(newEl);
        draw();
    }

    function addCustomImageElement(imageSrcPath) {
        const img = new Image();
        img.onload = function() {
            const initialWidth = 100;
            const initialHeight = (img.height / img.width) * initialWidth;
            const hexTashkeelColorCode = document.getElementById('tashkeelColor').value;
            
            elements.push({
                isImage: true,
                img: img,
                text: '[زخرفة]',
                x: (canvas.width / 2) / zoomLevel,
                y: (canvas.height / 2) / zoomLevel,
                width: initialWidth,
                height: initialHeight,
                baseRatio: img.height / img.width,
                size: initialWidth,
                thickness: 0,
                color: hexTashkeelColorCode,
                isTashkeel: false
            });
            draw();
        };
        img.src = imageSrcPath;
    }

    function updateSelectedThickness(val) {
        if (selectedElements.length === 0) return;
        selectedElements.forEach(el => {
            el.thickness = parseFloat(val);
        });
        draw();
    }

    function updateSelectedSize(val) {
        if (selectedElements.length === 0) return;
        const newSize = parseFloat(val);
                selectedElements.forEach(el => {
            el.size = newSize;
            if (el.isImage) {
                el.width = newSize;
                el.height = newSize * el.baseRatio;
            } else {
                calculateElementBounds(el);
            }
        });
        draw();
    }

    function updateElementColorsDirectly(type, chosenHexColor) {
        if (selectedElements.length === 0) return;
        selectedElements.forEach(el => {
            if (type === 'text' && !el.isTashkeel && !el.isImage) {
                el.color = chosenHexColor;
            } else if (type === 'tashkeel' && (el.isTashkeel || el.isImage)) {
                el.color = chosenHexColor;
            }
        });
        draw();
    }

    document.getElementById('textColor').addEventListener('input', (e) => updateElementColorsDirectly('text', e.target.value));
    document.getElementById('tashkeelColor').addEventListener('input', (e) => updateElementColorsDirectly('tashkeel', e.target.value));

    function clearCanvas() {
        elements = [];
        selectedElements = [];
        document.getElementById('thicknessSlider').value = 0;
        document.getElementById('sizeSlider').value = 110;
        document.getElementById('zoomSlider').value = 1;
        zoomLevel = 1.0;
        draw();
    }

    canvas.addEventListener('mousedown', function(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / zoomLevel;
        const mouseY = (e.clientY - rect.top) / zoomLevel;

        let hitElement = null;
        
        for (let i = elements.length - 1; i >= 0; i--) {
            const el = elements[i];
            const isDamma = (el.text === 'ُ');
            const hW = (isDamma ? 140 : el.width) / 1.2;
            const hH = (isDamma ? 110 : el.height) / 1.2;

            if (Math.abs(mouseX - el.x) < hW && Math.abs(mouseY - el.y) < hH) {
                hitElement = el;
                break;
            }
        }

        if (hitElement) {
            if (e.shiftKey) {
                if (selectedElements.includes(hitElement)) {
                    selectedElements = selectedElements.filter(el => el !== hitElement);
                } else {
                    selectedElements.push(hitElement);
                }
            } else {
                if (!selectedElements.includes(hitElement)) {
                    selectedElements = [hitElement];
                }
            }
            
            isDragging = true;
            document.getElementById('thicknessSlider').value = selectedElements.length === 1 ? selectedElements.thickness : 0;
            document.getElementById('sizeSlider').value = selectedElements.length === 1 ? selectedElements.size : 110;
            
            selectedElements.forEach(el => {
                el.dragStartX = mouseX - el.x;
                el.dragStartY = mouseY - el.y;
            });
        } else {
            if (!e.shiftKey) selectedElements = [];
            dragBoxStart = { x: mouseX * zoomLevel, y: mouseY * zoomLevel };
            currentDragBox = { x: mouseX * zoomLevel, y: mouseY * zoomLevel };
            document.getElementById('thicknessSlider').value = 0;
            document.getElementById('sizeSlider').value = 110;
        }
        draw();
    });

    canvas.addEventListener('mousemove', function(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / zoomLevel;
        const mouseY = (e.clientY - rect.top) / zoomLevel;

        if (isDragging && selectedElements.length > 0) {
            selectedElements.forEach(el => {
                el.x = mouseX - el.dragStartX;
                el.y = mouseY - el.dragStartY;
            });
            draw();
        } else if (dragBoxStart) {
            currentDragBox = { x: mouseX * zoomLevel, y: mouseY * zoomLevel };
            draw();
        }
    });

    window.addEventListener('mouseup', function(e) {
        isDragging = false;
        
        if (dragBoxStart && currentDragBox) {
            const x1 = Math.min(dragBoxStart.x, currentDragBox.x) / zoomLevel;
            const x2 = Math.max(dragBoxStart.x, currentDragBox.x) / zoomLevel;
            const y1 = Math.min(dragBoxStart.y, currentDragBox.y) / zoomLevel;
            const y2 = Math.max(dragBoxStart.y, currentDragBox.y) / zoomLevel;

            if (Math.abs(currentDragBox.x - dragBoxStart.x) > 6 || Math.abs(currentDragBox.y - dragBoxStart.y) > 6) {
                elements.forEach(el => {
                    if (el.x >= x1 && el.x <= x2 && el.y >= y1 && el.y <= y2) {
                        if (!selectedElements.includes(el)) selectedElements.push(el);
                    }
                });
            }
        }
        
        dragBoxStart = null;
        currentDragBox = null;
        draw();
    });

    canvas.addEventListener('dblclick', function(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / zoomLevel;
        const mouseY = (e.clientY - rect.top) / zoomLevel;

        for (let i = elements.length - 1; i >= 0; i--) {
            const el = elements[i];
            const isDamma = (el.text === 'ُ');
            const hW = (isDamma ? 140 : el.width) / 1.2;
            const hH = (isDamma ? 110 : el.height) / 1.2;

            if (Math.abs(mouseX - el.x) < hW && Math.abs(mouseY - el.y) < hH) {
                elements = elements.filter(item => item !== el);
                selectedElements = selectedElements.filter(item => item !== el);
                draw();
                break;
            }
        }
    });

    window.addEventListener('keydown', function(e) {
        if ((e.key === 'Delete' || e.key === 'Backspace') && selectedElements.length > 0) {
            elements = elements.filter(el => !selectedElements.includes(el));
            selectedElements = [];
            document.getElementById('thicknessSlider').value = 0;
            document.getElementById('sizeSlider').value = 110;
            draw();
        }
    });

    function exportTransparentPNG() {
        const temp = selectedElements;
        const prevZoom = zoomLevel;
        
        selectedElements = [];
        zoomLevel = 1.0;
        draw();
        
        const absoluteExportURI = canvas.toDataURL('image/png');
        const targetSystemAnchor = document.createElement('a');
        targetSystemAnchor.href = absoluteExportURI;
        targetSystemAnchor.download = 'woven_blanket_calligraphy.png';
        document.body.appendChild(targetSystemAnchor);
        targetSystemAnchor.click();
        document.body.removeChild(targetSystemAnchor);
        
        selectedElements = temp;
        zoomLevel = prevZoom;
        draw();
    }
</script>
